<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="古文">
<title>古文 用言ドリル 記録用紙</title>
<style>
  :root{
    --paper:#EDF1EC; --paper-2:#F6F8F5;
    --grid:#C4D2C7; --rule:#A8BCAD;
    --ink:#1B2420; --ink-2:#5A6862;
    --red:#C8362B; --red-2:#E8B0A8; --blue:#2E5C8A;
    --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
    --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:24px 24px;
    color:var(--ink);font-family:var(--gothic);min-height:100vh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .sheet{max-width:520px;margin:0 auto;padding:16px 16px 40px}

  .head{background:var(--paper-2);border:1.5px solid var(--ink);padding:12px 14px 10px;margin-bottom:14px}
  .head-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .title{font-family:var(--mincho);font-size:20px;font-weight:600;letter-spacing:.1em;margin:0}
  .stamp{font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:nowrap}
  .head-meta{display:flex;margin-top:10px;border-top:1px solid var(--rule);padding-top:8px}
  .meta-cell{flex:1;border-right:1px solid var(--rule);padding-right:6px}
  .meta-cell:last-child{border-right:0;padding-right:0;padding-left:8px}
  .meta-label{font-size:10px;color:var(--ink-2);letter-spacing:.06em}
  .meta-val{font-family:var(--mono);font-size:15px;margin-top:2px}

  .total{display:flex;align-items:flex-end;gap:6px;margin-bottom:4px}
  .total .n{font-family:var(--mono);font-size:38px;line-height:.9;color:var(--red)}
  .total .d{font-family:var(--mono);font-size:16px;color:var(--ink-2);padding-bottom:3px}
  .total .l{margin-left:auto;font-size:11px;color:var(--ink-2);padding-bottom:5px;letter-spacing:.08em}
  .bar{height:9px;background:var(--paper-2);border:1px solid var(--rule);margin-bottom:6px;position:relative;overflow:hidden}
  .bar i{position:absolute;top:0;bottom:0;display:block}
  .bar i.done{left:0;background:var(--red)}
  .bar i.half{background:var(--red-2)}
  .b-line{width:100%;padding:17px;background:#06C755;color:#fff;border:0;
    font-family:var(--gothic);font-size:16px;letter-spacing:.08em;cursor:pointer;margin-top:14px}
  .b-line:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
  .b-line:active{transform:translateY(1px)}
  .sendnote{font-size:12px;color:var(--ink-2);text-align:center;margin-top:7px;line-height:1.7}
  .daycard{border:1.5px solid #06C755;background:#fff;padding:11px 13px;margin-bottom:12px}
  .daycard .h{font-size:10px;letter-spacing:.14em;color:#06A048}
  .daycard .b{font-family:var(--mono);font-size:14px;margin-top:4px;color:var(--ink)}
  .daycard button{width:100%;margin-top:9px;padding:12px;background:#06C755;color:#fff;border:0;
    font-family:var(--gothic);font-size:14px;letter-spacing:.06em;cursor:pointer}
  .quota{border:2px solid var(--ink);background:#fff;padding:13px 14px;margin-bottom:14px}
  .quota .h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .quota .h .t{font-family:var(--mincho);font-size:16px;letter-spacing:.06em}
  .quota .h .d{font-family:var(--mono);font-size:11.5px;color:var(--red)}
  .quota .big{display:flex;align-items:flex-end;gap:5px;margin-top:8px}
  .quota .big .n{font-family:var(--mono);font-size:34px;line-height:.9;color:var(--red)}
  .quota .big .s{font-family:var(--mono);font-size:15px;color:var(--ink-2);padding-bottom:2px}
  .quota .big .l{margin-left:auto;font-size:12px;color:var(--ink-2);padding-bottom:3px}
  .quota .qbar{height:9px;background:var(--paper-2);border:1px solid var(--rule);margin-top:9px;position:relative;overflow:hidden}
  .quota .qbar i{position:absolute;left:0;top:0;bottom:0;background:var(--red)}
  .quota .note{font-size:12.5px;color:var(--ink-2);line-height:1.75;margin-top:8px}
  .quota.clear{border-color:#06C755}
  .quota.clear .h .d{color:#06A048}
  .quota.clear .big .n{color:#06A048}
  .quota.clear .qbar i{background:#06C755}
  .flipq{font-family:var(--mincho);font-size:30px;line-height:1.5;letter-spacing:.06em;margin:6px 0 2px}
  .flipn{font-family:var(--mono);font-size:15px;color:var(--red);margin-top:6px}
  .flipa{font-family:var(--mincho);font-size:25px;line-height:1.85;letter-spacing:.06em;
    border:2px solid var(--red);background:#fff;padding:14px 15px;margin-top:14px;text-align:left}
  .selfgrade{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .sg{padding:17px 4px;border:1.5px solid var(--ink);font-family:var(--gothic);
    font-size:15px;letter-spacing:.06em;cursor:pointer;background:var(--paper-2);color:var(--ink)}
  .sg.ok{border-color:var(--red);color:var(--red)}
  .sg.ng{border-color:var(--blue);color:var(--blue)}
  .sg:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
  .sechead{display:flex;align-items:baseline;gap:8px;margin:24px 0 10px;
    border-bottom:1.5px solid var(--ink);padding-bottom:7px}
  .sechead .n{font-family:var(--mono);font-size:11px;color:var(--red);letter-spacing:.1em}
  .sechead .t{font-family:var(--mincho);font-size:17px;letter-spacing:.08em}
  .sechead .s{margin-left:auto;font-size:11px;color:var(--ink-2)}
  .ch-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule);
    padding:13px 2px;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;
    width:100%;text-align:left;font-family:var(--gothic)}
  .ch-row:focus-visible{outline:2.5px solid var(--blue);outline-offset:-2px}
  .ch-row .mk{font-family:var(--mincho);font-size:17px;width:20px;text-align:center;color:var(--rule)}
  .ch-row .mk.done{color:var(--red)}
  .ch-row .t{font-family:var(--mincho);font-size:16px;flex:1;min-width:0;color:var(--ink)}
  .ch-row .c{font-family:var(--mono);font-size:11px;color:var(--ink-2)}

  .lrn-top{display:flex;align-items:center;gap:8px;margin-bottom:12px;
    border-bottom:1.5px solid var(--ink);padding-bottom:8px}
  .lrn-top .t{font-family:var(--mincho);font-size:16px;letter-spacing:.06em}
  .dots{display:flex;gap:4px;margin-bottom:22px}
  .dots i{flex:1;height:4px;background:var(--paper-2);border:1px solid var(--rule)}
  .dots i.on{background:var(--red);border-color:var(--red)}
  .lrn h3{font-family:var(--mincho);font-size:22px;line-height:1.5;letter-spacing:.04em;margin:0 0 14px}
  .lrn p{font-size:15px;line-height:2.05;margin:0 0 14px}
  .lrn p b{color:var(--red)}
  .lrn .ex{font-family:var(--mincho);font-size:24px;line-height:1.8;letter-spacing:.05em;
    border-left:3px solid var(--red);background:var(--paper-2);padding:12px 15px;margin:0 0 16px}
  .lrn .ex small{font-family:var(--gothic);font-size:12px;color:var(--ink-2);letter-spacing:0}
  .lrn .box2{border:1.5px solid var(--ink);background:#fff;padding:12px 14px;margin:0 0 16px;
    font-size:14.5px;line-height:1.95}
  .lrn .box2 b{color:var(--red)}
  .lrn table{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:14px}
  .lrn th,.lrn td{border:1px solid var(--rule);padding:8px 9px;text-align:left}
  .lrn th{background:var(--paper-2);font-size:12px;color:var(--ink-2);font-weight:600;white-space:nowrap}
  .lrn td.k{font-family:var(--mincho);font-size:16px;white-space:nowrap}
  .lrn .qbox{border:2px solid var(--blue);background:#fff;padding:13px 14px;margin-top:4px}
  .lrn .qbox .qh{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--blue)}
  .lrn .qbox .qa{font-family:var(--mincho);font-size:18px;line-height:1.6;margin:5px 0 12px}
  .lrn .qopts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .lrn .qopts button{padding:14px 4px;background:var(--paper-2);border:1.5px solid var(--ink);
    font-family:var(--gothic);font-size:15px;color:var(--ink);cursor:pointer}
  .lrn .qopts button.ans{background:#fff;border-color:var(--red);color:var(--red);font-weight:700}
  .lrn .qopts button.bad{background:#fff;border-color:var(--blue);color:var(--blue);text-decoration:line-through}
  .lrn .qwhy{margin-top:11px;font-size:14px;line-height:1.9;border-left:3px solid var(--red);
    background:var(--paper-2);padding:9px 12px}
  .flipa .ktbl{width:100%;border-collapse:collapse;font-size:19px}
  .flipa .ktbl th{font-family:var(--gothic);font-size:9.5px;color:var(--ink-2);font-weight:400;
    border:1px solid var(--rule);padding:3px 1px;text-align:center;letter-spacing:0}
  .flipa .ktbl td{border:1px solid var(--rule);padding:8px 1px;text-align:center;
    font-family:var(--mincho);line-height:1.2}
  .flipa .ktbl td.lb{font-family:var(--gothic);font-size:10px;color:var(--ink-2);
    white-space:nowrap;padding:8px 4px}
  .flipa .ktbl th.lb{border-color:var(--rule)}
  .flipex{font-family:var(--gothic);font-size:12px;color:var(--ink-2);margin-top:9px;text-align:center}
  .flipq2{font-family:var(--mincho);font-size:20px;color:var(--ink-2);margin-top:4px}

  /* ---- タイムアタック ---- */
  .ta{background:#141A22;color:#EDF1EC;margin:-16px -16px 0;padding:16px 16px 26px;min-height:88vh}
  .ta-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .ta-top .nm{font-family:var(--mincho);font-size:15px;letter-spacing:.06em;color:#9FB3A6}
  .ta-quit{margin-left:auto;padding:5px 10px;background:transparent;border:1px solid #3A4A44;
    color:#9FB3A6;font-size:12px;font-family:var(--gothic);cursor:pointer}
  .ta-bar{height:10px;background:#232C36;position:relative;overflow:hidden;margin-bottom:4px}
  .ta-bar i{position:absolute;left:0;top:0;bottom:0;background:#F0C24A;width:100%}
  .ta-bar.warn i{background:#E4593F}
  .ta-time{font-family:var(--mono);font-size:12px;color:#9FB3A6;text-align:right;margin-bottom:16px}
  .ta-hud{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px}
  .ta-score{font-family:var(--mono);font-size:40px;line-height:.9;color:#F0C24A}
  .ta-score .u{font-size:13px;color:#9FB3A6;margin-left:4px}
  .ta-combo{margin-left:auto;text-align:right}
  .ta-combo .c{font-family:var(--mono);font-size:26px;line-height:1;color:#EDF1EC}
  .ta-combo .c.hot{color:#E4593F}
  .ta-combo .l{font-size:10px;color:#9FB3A6;letter-spacing:.14em}
  .ta-q{text-align:center;padding:6px 0 4px;min-height:150px}
  .ta-ask{font-size:11.5px;color:#7D9187;letter-spacing:.12em;margin-bottom:10px}
  .ta-word{font-family:var(--mincho);font-size:52px;line-height:1.2;letter-spacing:.05em;color:#fff}
  .ta-word ruby rt{font-size:.26em;color:#7D9187}
  .ta-word.kana{font-size:42px}
  .ta-cue{font-family:var(--mincho);font-size:22px;color:#F0C24A;margin-top:8px}
  .ta-sent{font-family:var(--mincho);font-size:19px;line-height:2;text-align:left;color:#EDF1EC;
    background:#1C242E;border-left:3px solid #3A4A44;padding:11px 13px;margin:2px 0}
  .ta-sent u{text-decoration:none;border-bottom:2.5px solid #F0C24A;color:#F0C24A}
  .ta-sub{font-size:11.5px;color:#7D9187;margin-top:6px}
  .ta-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .ta-opts button{padding:17px 4px;background:#1F2831;border:1.5px solid #3A4A44;color:#EDF1EC;
    font-family:var(--gothic);font-size:16px;cursor:pointer}
  .ta-opts button.kana{font-family:var(--mincho);font-size:21px}
  .ta-opts button.hit{background:#1E3A2C;border-color:#4FD18A;color:#8FE8B4}
  .ta-opts button.mis{background:#3A2020;border-color:#E4593F;color:#F0A08F}
  .ta-opts button.show{border-color:#F0C24A;color:#F0C24A}
  .ta-fly{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-family:var(--mono);
    font-size:30px;color:#F0C24A;pointer-events:none;animation:fly .6s ease-out forwards}
  @keyframes fly{0%{opacity:1;transform:translate(-50%,0) scale(1)}
    100%{opacity:0;transform:translate(-50%,-40px) scale(1.3)}}
  .ta-flash{position:fixed;inset:0;pointer-events:none;background:#4FD18A;opacity:.13;animation:fade .3s ease-out forwards}
  .ta-flash.bad{background:#E4593F}
  @keyframes fade{to{opacity:0}}
  .ta-res{text-align:center;padding:10px 0}
  .ta-res .big{font-family:var(--mono);font-size:64px;line-height:1;color:#F0C24A}
  .ta-res .lb{font-size:11px;color:#7D9187;letter-spacing:.14em;margin-top:4px}
  .ta-res .rec{margin-top:16px;border:1.5px solid #F0C24A;padding:11px;font-size:14px;color:#F0C24A}
  .ta-res .stat{display:flex;gap:0;margin-top:18px;border-top:1px solid #3A4A44;padding-top:12px}
  .ta-res .stat div{flex:1;border-right:1px solid #3A4A44}
  .ta-res .stat div:last-child{border-right:0}
  .ta-res .stat .n{font-family:var(--mono);font-size:20px;color:#EDF1EC}
  .ta-res .stat .l{font-size:10px;color:#7D9187;letter-spacing:.1em;margin-top:3px}
  .ta-res .miss{margin-top:16px;font-family:var(--mincho);font-size:17px;line-height:1.8;
    color:#F0A08F;text-align:left}
  .ta-btn{width:100%;padding:16px;margin-top:8px;background:#F0C24A;color:#141A22;border:0;
    font-family:var(--gothic);font-size:15px;letter-spacing:.1em;cursor:pointer}
  .ta-btn.sub{background:transparent;border:1.5px solid #3A4A44;color:#EDF1EC}
  .ta-cd{text-align:center;padding:70px 0}
  .ta-cd .n{font-family:var(--mono);font-size:90px;line-height:1;color:#F0C24A;animation:pop .4s ease-out}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .modesel{display:flex;gap:7px;margin:10px 0 4px}
  .modesel button{flex:1;padding:11px 4px;background:var(--paper-2);border:1.5px solid var(--rule);
    color:var(--ink-2);font-family:var(--gothic);font-size:13px;cursor:pointer}
  .modesel button.on{border-color:var(--ink);border-width:2px;color:var(--ink);background:#fff;font-weight:700}
  .modenote{font-size:11.5px;color:var(--ink-2);margin-bottom:12px;line-height:1.7}
  @media (prefers-reduced-motion:reduce){
    .ta-fly,.ta-flash,.ta-cd .n{animation:none!important}
    .ta-flash{display:none}
  }

  .tacard{background:#141A22;color:#EDF1EC;padding:14px 15px 15px;margin-bottom:16px}
  .tacard .tc-h{display:flex;align-items:baseline;gap:8px}
  .tacard .tc-h .t{font-family:var(--mincho);font-size:17px;letter-spacing:.06em;color:#F0C24A}
  .tacard .tc-h .s{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:#7D9187}
  .tacard .tc-b{font-size:12.5px;color:#9FB3A6;line-height:1.75;margin-top:6px}
  .tacard .tc-n{font-family:var(--mono);font-size:26px;color:#EDF1EC;margin-top:8px}
  .tacard .tc-n .u{font-size:11px;color:#7D9187;margin-left:5px}
  .tacard .tc-go{width:100%;margin-top:11px;padding:14px;background:#F0C24A;color:#141A22;border:0;
    font-family:var(--gothic);font-size:15px;letter-spacing:.12em;cursor:pointer}
  .tacard .tc-go:focus-visible{outline:2.5px solid #fff;outline-offset:2px}
  .tp-note{font-size:12.5px;color:#9FB3A6;line-height:1.8;margin-bottom:14px}
  .tp-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:#1F2831;border:1.5px solid #3A4A44;color:#EDF1EC;padding:15px 13px;
    margin-bottom:8px;font-family:var(--gothic);cursor:pointer}
  .tp-row .no{font-family:var(--mono);font-size:11px;color:#7D9187}
  .tp-row .nm{font-family:var(--mincho);font-size:16px;flex:1;min-width:0}
  .tp-row .bs{font-family:var(--mono);font-size:14px;color:#F0C24A;white-space:nowrap}
  .tp-row:focus-visible{outline:2.5px solid #F0C24A;outline-offset:2px}
  .b-help{padding:13px 14px;background:var(--paper-2);border:1.5px solid var(--ink-2);color:var(--ink-2);
    font-family:var(--gothic);font-size:13px;cursor:pointer;white-space:nowrap}
  .reftop{display:flex;gap:8px;margin-bottom:20px}
  .reftop .b-ref{margin-bottom:0}
  .intro h2{font-family:var(--mincho);font-size:19px;letter-spacing:.06em;margin:0 0 14px;
    border-bottom:1.5px solid var(--ink);padding-bottom:8px}
  .intro .st{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--rule)}
  .intro .st .i{font-family:var(--mono);font-size:20px;color:var(--red);flex:0 0 26px;line-height:1.3}
  .intro .st .t{font-size:14.5px;line-height:1.85}
  .intro .st .t b{font-family:var(--mincho);font-size:16px}
  .intro .why{border:1.5px solid #06C755;background:#fff;padding:12px 14px;margin-top:18px;
    font-size:14px;line-height:1.9}
  .intro .why b{color:#06A048}
  .rule{font-size:12.5px;color:var(--ink-2);line-height:1.7;margin-bottom:8px}
  .rule b{color:var(--red)}
  .legend{display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px;color:var(--ink-2);margin-bottom:16px}
  .legend span{border:1px solid var(--rule);background:var(--paper-2);padding:4px 8px;
    display:flex;align-items:center;gap:5px}
  .legend b.num{font-family:var(--mono);font-size:13px;color:var(--ink);font-weight:400}

  .today{border:1.5px solid var(--blue);background:#fff;padding:10px 12px;margin-bottom:12px}
  .today .h{font-size:10px;letter-spacing:.14em;color:var(--blue)}
  .today .b{font-family:var(--mincho);font-size:15px;line-height:1.7;margin-top:3px}
  .b-ref{width:100%;padding:13px;background:var(--paper-2);border:1.5px solid var(--blue);color:var(--blue);
    font-family:var(--gothic);font-size:14px;letter-spacing:.08em;cursor:pointer;margin-bottom:20px}

  .ev-row{border-bottom:1px solid var(--rule);padding:12px 2px 13px}
  .ev-row:first-of-type{border-top:1.5px solid var(--ink)}
  .ev-line{display:flex;align-items:baseline;gap:9px}
  .ev-no{font-family:var(--mono);font-size:11px;color:var(--red);width:16px}
  .ev-nm{font-family:var(--mincho);font-size:17px;letter-spacing:.05em;flex:1;min-width:0}
  .ev-ct{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
  .ev-bar{height:6px;background:var(--paper-2);border:1px solid var(--rule);margin:8px 0 4px 25px;position:relative;overflow:hidden}
  .ev-bar i{position:absolute;top:0;bottom:0}
  .ev-bar i.done{left:0;background:var(--red)}
  .ev-bar i.half{background:var(--red-2)}
  .ev-sub{margin-left:25px;font-size:11px;color:var(--ink-2);margin-bottom:9px}
  .ev-btns{display:flex;gap:7px;margin-left:25px}
  .b-go{flex:1;padding:11px;background:var(--ink);color:var(--paper-2);border:0;
    font-family:var(--gothic);font-size:14px;letter-spacing:.1em;cursor:pointer}
  .b-fix{padding:11px 14px;background:var(--paper-2);border:1.5px solid var(--blue);color:var(--blue);
    font-family:var(--gothic);font-size:13px;cursor:pointer;white-space:nowrap}

<body>
<div class="sheet">
  <div class="head">
    <div class="head-top">
      <h1 class="title">古文　用言ドリル</h1>
      <span class="stamp" id="stamp">—</span>

    <div class="head-meta" id="meta"></div>
  </div>
  <div id="app"></div>
  <div class="foot" id="foot"></div>

<script>
(function(){
"use strict";

/* ===== 保存 ===== */
var mem={};
function load(k,d){ try{var v=localStorage.getItem(k);return v===null?d:v;}catch(e){return (k in mem)?mem[k]:d;} }
function save(k,v){ try{localStorage.setItem(k,v);}catch(e){mem[k]=v;} }
var KEY="kobun.v6", P={};
try{ P=JSON.parse(load(KEY,"{}"))||{}; }catch(e){ P={}; }
function flush(){ save(KEY,JSON.stringify(P)); }
function st(id){ return (id in P)?P[id]:-1; }          /* -1未 0間違い 1あと1回 2済 */
function mval(s){ return s===2?2:(s===1?1:0); }
function mark(id,ok){
  var c=st(id), before=mval(c);
  P[id]= ok ? ((c<0)?1:Math.min(2,c+1)) : 0; flush();
  var d=mval(P[id])-before;
  if(d>0) addDayMarks(d);
  return d;
}

/* ===== 今日の記録 ===== */
function pad(n){ return (n<10?"0":"")+n; }
function todayStr(){ var d=new Date(); return (d.getMonth()+1)+"/"+d.getDate(); }
function dayKey(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
var DAY={};
try{ DAY=JSON.parse(load("kobun.day","{}"))||{}; }catch(e){ DAY={}; }
if(DAY.date!==dayKey()) DAY={date:dayKey(),runs:[],marks:0};
if(typeof DAY.marks!=="number") DAY.marks=0;
function ensureDay(){ if(DAY.date!==dayKey()) DAY={date:dayKey(),runs:[],marks:0}; }
function addDayMarks(d){ ensureDay(); DAY.marks+=d; save("kobun.day",JSON.stringify(DAY)); }
function pushRun(r){ ensureDay(); DAY.runs.push(r); save("kobun.day",JSON.stringify(DAY)); }

/* ===== 締切 ===== */
var DEADLINE=new Date(2026,7,31);      /* 2026年8月31日 */
function daysLeft(){
  var t=new Date(); t.setHours(0,0,0,0);
  return Math.max(1, Math.round((DEADLINE-t)/86400000)+1);
}
function sendLine(text){
  var url="https://line.me/R/share?text="+encodeURIComponent(text);
  try{ var win=window.open(url,"_blank"); if(win) return url; }catch(e){}
  try{ window.location.href=url; }catch(e){}
  return url;
}

/* ===== 五十音 ===== */
var G={ "ア":["あ","い","う","え"],"カ":["か","き","く","け"],"ガ":["が","ぎ","ぐ","げ"],
  "サ":["さ","し","す","せ"],"ザ":["ざ","じ","ず","ぜ"],"タ":["た","ち","つ","て"],
  "ダ":["だ","ぢ","づ","で"],"ナ":["な","に","ぬ","ね"],"ハ":["は","ひ","ふ","へ"],
  "バ":["ば","び","ぶ","べ"],"マ":["ま","み","む","め"],"ヤ":["や","い","ゆ","え"],
  "ラ":["ら","り","る","れ"],"ワ":["わ","ゐ","う","ゑ"] };
var GYOLIST=["ア","カ","ガ","サ","ザ","タ","ダ","ナ","ハ","バ","マ","ヤ","ラ","ワ"];
var KIND={yodan:"四段",kami1:"上一段",kami2:"上二段",shimo1:"下一段",shimo2:"下二段",
  ra:"ラ変",na:"ナ変",ka:"カ変",sa:"サ変"};
var KIND6=["四段","上一段","上二段","下一段","下二段","変格"];
var FORMS=["未然形","連用形","終止形","連体形","已然形","命令形"];

function tail(t,gy){ var g=G[gy]||[],a=g[0],i=g[1],u=g[2],e=g[3];
  switch(t){
    case "yodan": return [a,i,u,u,e,e];
    case "kami2": return [i,i,u,u+"る",u+"れ",i+"よ"];
    case "shimo2":return [e,e,u,u+"る",u+"れ",e+"よ"];
    case "kami1": return [i,i,i+"る",i+"る",i+"れ",i+"よ"];
    case "shimo1":return [e,e,e+"る",e+"る",e+"れ",e+"よ"];
    case "ra":    return [a,i,i,u,e,e];
    case "na":    return [a,i,u,u+"る",u+"れ",e];
    case "ka":    return ["こ","き","く","くる","くれ","こ"];
    case "sa":    return ["せ","し","す","する","すれ","せよ"];
  } return []; }
function conj(v){ return tail(v.t,v.g).map(function(x){return v.s+x;}); }
function kind6(t){ return (t==="ra"||t==="na"||t==="ka"||t==="sa")?"変格":KIND[t]; }

/* ===== コツ一覧 ===== */
var REF=
'<div class="ref">'+

'<h2>1　活用の種類の見分け方</h2>'+
'<div class="step"><span class="i">1</span><span>まず<b>語ごと覚える組</b>に入っていないか確かめる。下の表の語なら、そこで決まり。</span></div>'+
'<div class="step"><span class="i">2</span><span>入っていなければ「<b>ず</b>」をつける。</span></div>'+
'<div class="step"><span class="i">3</span><span>「ず」の直前の音を見る。</span></div>'+
'<table><tr><th>ずの直前</th><th>活用の種類</th><th>例</th></tr>'+
'<tr><td class="k">ア段</td><td>四段</td><td class="k">書かず・思はず</td></tr>'+
'<tr><td class="k">イ段</td><td>上二段</td><td class="k">過ぎず・落ちず</td></tr>'+
'<tr><td class="k">エ段</td><td>下二段</td><td class="k">受けず・捨てず</td></tr></table>'+
'<div class="box">語ごと覚える組（数が決まっている）<br>'+
'　<b>下一段</b>＝蹴る（1語）<br>'+
'　<b>カ変</b>＝来（1語）　<b>サ変</b>＝す・おはす（2語）<br>'+
'　<b>ナ変</b>＝死ぬ・往ぬ（2語）<br>'+
'　<b>ラ変</b>＝あり・をり・はべり・いまそかり（4語）<br>'+
'　<b>上一段</b>＝干る・射る・鋳る・着る・似る・煮る・見る・居る・率る（9語）<br>'+
'　　「ひ・い・き・に・み・ゐる」で覚える</div>'+
'<div class="note">注意　「あり」に ず をつけると「あらず」でア段になるが、ラ変。「死ぬ」も「死なず」でア段だがナ変。<b>だから語リストの確認が先</b>。</div>'+

'<h2>2　活用の行</h2>'+
'<div class="box"><b>行</b>と<b>種類</b>は別のことを聞いている。<br>'+
'　<b>行</b>　＝　五十音のどの行で音が変わるか（カ行・ヤ行など）<br>'+
'　<b>種類</b>＝　変化のパターン（四段・上二段・下二段など）<br>'+
'たとえば「得」は え・え・う・うる・うれ・えよ。ア行で変化し、パターンは下二段。'+
'だから答えは「<b>ア行下二段</b>」。設問はたいてい両方を聞いてくる。</div>'+
'<p>行は、基本形の最後の音でほぼ決まる。</p>'+
'<table><tr><th>終わり</th><th>行</th><th>終わり</th><th>行</th></tr>'+
'<tr><td class="k">〜く</td><td>カ行</td><td class="k">〜ぬ</td><td>ナ行</td></tr>'+
'<tr><td class="k">〜ぐ</td><td>ガ行</td><td class="k">〜ふ</td><td>ハ行</td></tr>'+
'<tr><td class="k">〜す</td><td>サ行</td><td class="k">〜ぶ</td><td>バ行</td></tr>'+
'<tr><td class="k">〜つ</td><td>タ行</td><td class="k">〜む</td><td>マ行</td></tr>'+
'<tr><td class="k">〜づ</td><td>ダ行</td><td class="k">〜る</td><td>ラ行</td></tr></table>'+
'<div class="box">例外はこの3行だけ。ここが試験に出る。<br>'+
'　<b>ア行</b>＝得（1語のみ）<br>'+
'　<b>ヤ行</b>＝射る・鋳る（上一段）／老ゆ・悔ゆ・報ゆ（上二段）／見ゆ・覚ゆ・絶ゆ（下二段）<br>'+
'　<b>ワ行</b>＝居る・率る（上一段）／植う・飢う・据う（下二段）</div>'+

'<h2>3　活用形の見分け方</h2>'+
'<p>下に続く語で決まる。訳が分からなくても形は決まる。</p>'+
'<table><tr><th>下に続く語</th><th>活用形</th></tr>'+
'<tr><td class="k">ず・ば・む・る・す</td><td>未然形</td></tr>'+
'<tr><td class="k">て・たり・けり・き</td><td>連用形</td></tr>'+
'<tr><td class="k">言い切り／とも・べし</td><td>終止形</td></tr>'+
'<tr><td class="k">とき・こと・体言</td><td>連体形</td></tr>'+
'<tr><td class="k">ども</td><td>已然形</td></tr>'+
'<tr><td class="k">命令して言い切り</td><td>命令形</td></tr></table>'+
'<div class="box">係り結び　文中に係助詞があると、結びの活用形が変わる。<br>'+
'　<b>ぞ・なむ・や・か</b> → 連体形で結ぶ<br>'+
'　<b>こそ</b> → 已然形で結ぶ</div>'+

'<h2>4　形容詞・形容動詞</h2>'+
'<p>形容詞は「なる」をつけて確かめる。</p>'+
'<table><tr><th>形</th><th>種類</th><th>例</th></tr>'+
'<tr><td class="k">〜くなる</td><td>ク活用</td><td class="k">なし・高し・よし</td></tr>'+
'<tr><td class="k">〜しくなる</td><td>シク活用</td><td class="k">悲し・をかし・いみじ</td></tr>'+
'<tr><td class="k">〜なり</td><td>ナリ活用</td><td class="k">静かなり・あはれなり</td></tr>'+
'<tr><td class="k">〜たり</td><td>タリ活用</td><td class="k">堂々たり・漫々たり</td></tr></table>'+
'<div class="note">「いみじ」は「し」で終わらないがシク活用。タリ活用は漢文調の語だけで数が少ない。</div>'+

'<h2>5　音便の見分け方</h2>'+
'<p>発音しやすいように音が変わったもの。<b>変わった後の音</b>を見れば決まる。</p>'+
'<table><tr><th>変わった音</th><th>名前</th><th>もとの音</th><th>例</th></tr>'+
'<tr><td class="k">い</td><td>イ音便</td><td class="k">き・ぎ</td><td class="k">書きて→書いて</td></tr>'+
'<tr><td class="k">う</td><td>ウ音便</td><td class="k">く・ひ・み</td><td class="k">美しく→美しう</td></tr>'+
'<tr><td class="k">ん</td><td>撥音便</td><td class="k">び・み・に</td><td class="k">読みて→読んで</td></tr>'+
'<tr><td class="k">っ</td><td>促音便</td><td class="k">ち・ひ・り</td><td class="k">待ちて→待って</td></tr></table>'+
'<div class="box">覚え方　<b>い・う・ん・っ</b> の4つ。出てきた音がこの4つのどれかを見るだけ。</div>'+
'<div class="note">撥音便の「ん」は書かれないことがある（あるなり→あんなり→あなり）。</div>'+

'</div>';

/* ===== 得点tips ===== */

    '<th>未然</th><th>連用</th><th>終止</th><th>連体</th><th>已然</th><th>命令</th></tr>';
  rows.forEach(function(r){
    h+='<tr>'+(label?'<td class="lb">'+r[0]+'</td>':'');
    var c=label?r.slice(1):r;
    c.forEach(function(x){ h+='<td>'+x+'</td>'; });
    h+='</tr>';
  });
  return h+'</table>';
}

function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),s=a[i];a[i]=a[j];a[j]=s;}return a;}
function distract(c,pool,n){return shuffle(shuffle(pool.filter(function(x){return x!==c;})).slice(0,n-1).concat([c]));}
function ruby(w,y){return (y&&y!==""&&y!==w)?'<ruby>'+w+'<rt>'+y+'</rt></ruby>':w;}
function tipKind(v){ return (v.n? v.n+"<br>":"")+TIP_KIND[v.t]; }
function tipGyo(v){ return (v.n? v.n+"<br>":"")+(TIP_GYO[v.g]||TIP_GYO.def); }

function stats(ev){ var done=0,half=0,bad=0,none=0;
  ev.ids.forEach(function(id){ var s=st(id);
    if(s===2) done++; else if(s===1) half++; else if(s===0) bad++; else none++; });
  return {done:done,half:half,bad:bad,none:none,total:ev.ids.length,
          marks:done*2+half, need:ev.ids.length*2}; }
function totalStats(){ var o={done:0,half:0,bad:0,none:0,total:0,marks:0,need:0};
  EVENTS.forEach(function(e){ var s=stats(e);
    o.done+=s.done;o.half+=s.half;o.bad+=s.bad;o.none+=s.none;
    o.total+=s.total;o.marks+=s.marks;o.need+=s.need; });
  return o; }

var N=10;
function selectIds(ev,onlyBad){
  var bad=[],none=[],one=[],ok=[];
  ev.ids.forEach(function(id){ var s=st(id);
    if(s===0) bad.push(id); else if(s<0) none.push(id); else if(s===1) one.push(id); else ok.push(id); });
  if(onlyBad) return shuffle(bad).slice(0,N);
  none=shuffle(none); one=shuffle(one);
  var mix=[],a=0,b=0;                       /* 未2つに対し「あと1回」1つを混ぜる */
  while(a<none.length||b<one.length){
    if(a<none.length) mix.push(none[a++]);
    if(a<none.length) mix.push(none[a++]);
    if(b<one.length)  mix.push(one[b++]);
  }
  return shuffle(bad).concat(mix,shuffle(ok)).slice(0,N);
}

var TA_SEC=30;
var ta={};

function taQueue(ev,n){
  var bad=[],none=[],one=[],ok=[];
  ev.ids.forEach(function(id){ var v=st(id);
    if(v===0) bad.push(id); else if(v<0) none.push(id); else if(v===1) one.push(id); else ok.push(id); });
  var q=shuffle(bad).concat(shuffle(none),shuffle(one),shuffle(ok));
  while(q.length<n) q=q.concat(shuffle(ev.ids));
  return q.slice(0,n);
}

function beginTA(e){
  ev=e; isFix=false; isAll=false;
  ta={ ids:taQueue(e,60), i:0, score:0, combo:0, best:0, hit:0, miss:0,
       missed:[], t0:0, lock:false, over:false };
  taCountdown(3);
}
function taCountdown(n){
  app.innerHTML='<div class="ta"><div class="ta-top"><span class="nm">'+ev.name+'　30秒</span>'+
    '<button class="ta-quit" type="button" id="taq">やめる</button></div>'+
    '<div class="ta-cd"><div class="n">'+(n>0?n:"START")+'</div></div></div>';
  metaBox.innerHTML='<div class="meta-cell"><div class="meta-label">タイムアタック</div>'+
    '<div class="meta-val">'+ev.no+'</div></div>'+
    '<div class="meta-cell"><div class="meta-label">自己ベスト</div><div class="meta-val">'+
    (BEST[ev.key]&&BEST[ev.key].score||0)+'</div></div>'+
    '<div class="meta-cell"><div class="meta-label">秒</div><div class="meta-val">'+TA_SEC+'</div></div>';
  foot.textContent="";
  document.getElementById("taq").addEventListener("click",function(){ ta.over=true; taPicker(); });
  setTimeout(function(){
    if(ta.over) return;
    if(n>0) taCountdown(n-1);
    else { ta.t0=Date.now(); taTick(); taRender(); }
  }, n>0?700:500);
}
function taTick(){
  clearInterval(tick);
  tick=setInterval(function(){
    if(ta.over){ clearInterval(tick); return; }
    var left=TA_SEC-(Date.now()-ta.t0)/1000;
    if(left<=0){ clearInterval(tick); taFinish(); return; }
    var b=document.getElementById("tabar"), t=document.getElementById("tatime");
    if(b){ b.style.width=(left/TA_SEC*100)+"%";
      b.parentNode.className="ta-bar"+(left<8?" warn":""); }
    if(t) t.textContent=left.toFixed(1)+" 秒";
  },100);
}
function taRender(){
  if(ta.i>=ta.ids.length) ta.ids=ta.ids.concat(taQueue(ev,30));
  var id=ta.ids[ta.i], q=ev.make(ev.pool[ev.ids.indexOf(id)]);
  ta.q=q; ta.id=id; ta.lock=false;

    (BEST[ev.key]&&BEST[ev.key].score||0)+'</div></div>';

    var b=document.createElement("button");

  });
}
function taAnswer(picked){
  if(ta.lock||ta.over) return;
  ta.lock=true;
  var q=ta.q, ok=(picked===q.ans);
  mark(ta.id,ok);
  var bs=app.querySelectorAll(".ta-opts button");
  for(var i=0;i<bs.length;i++){
    var o=bs[i].getAttribute("data-o"); bs[i].disabled=true;
    if(o===q.ans) bs[i].className+=(ok?" hit":" show");
    else if(o===picked) bs[i].className+=" mis";
  }
  var fl=document.createElement("div");
  fl.className="ta-flash"+(ok?"":" bad"); document.body.appendChild(fl);
  setTimeout(function(){ if(fl.parentNode) fl.parentNode.removeChild(fl); },320);

  if(ok){
    ta.hit++; ta.combo++; if(ta.combo>ta.best) ta.best=ta.combo;
    var pts=10+Math.min(ta.combo-1,10)*2;
    ta.score+=pts;
    var f=document.createElement("div"); f.className="ta-fly"; f.textContent="+"+pts;
    document.body.appendChild(f);
    setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); },620);
    setTimeout(function(){ if(!ta.over){ ta.i++; taRender(); } },260);
  } else {
    ta.miss++; ta.combo=0;
    if(ta.missed.indexOf(q.log)<0) ta.missed.push(q.log);
    setTimeout(function(){ if(!ta.over){ ta.i++; taRender(); } },1100);
  }
}
function taFinish(){
  ta.over=true; clearInterval(tick);
  var prev=BEST[ev.key]&&BEST[ev.key].score||0, isNew=ta.score>prev;
  if(isNew){ BEST[ev.key]={score:ta.score,combo:ta.best,date:dayKey()};
    save("kobun.best",JSON.stringify(BEST)); }
  pushRun({name:ev.name+"（30秒）",hits:ta.hit,n:ta.hit+ta.miss,missed:ta.missed});
  var T=totalStats();
  var txt="古文ドリル "+todayStr()+"\n"+ev.name+"（30秒）\n"+
    ta.score+"点　正解"+ta.hit+"　最高れんぞく"+ta.best+
    (isNew?"　自己ベスト更新":"　ベスト"+prev)+"\n"+
    (ta.missed.length?"間違い: "+ta.missed.join("、"):"ノーミス")+
    "\n今日の○ "+DAY.marks;
  app.innerHTML='<div class="ta"><div class="ta-top"><span class="nm">'+ev.name+'　30秒</span></div>'+
    '<div class="ta-res"><div class="big">'+ta.score+'</div><div class="lb">てん</div>'+
    (isNew
      ? '<div class="rec">'+(prev>0?'自己ベスト更新　これまで '+prev+' 点':'はじめての記録')+'</div>'
      : '<div class="rec" style="border-color:#3A4A44;color:#9FB3A6">自己ベスト '+prev+' 点　あと '+
        Math.max(1,prev-ta.score+1)+' 点</div>')+
    '<div class="stat"><div><div class="n">'+ta.hit+'</div><div class="l">せいかい</div></div>'+
    '<div><div class="n">'+ta.miss+'</div><div class="l">ミス</div></div>'+
    '<div><div class="n">'+ta.best+'</div><div class="l">さいこうれんぞく</div></div></div>'+
    (ta.missed.length?'<div class="miss">間違い　'+ta.missed.join("　")+'</div>':'')+
    '<button class="ta-btn" type="button" id="tagain">もう1回</button>'+
    '<button class="ta-btn sub" type="button" id="taline">LINEで送る</button>'+
    '<button class="ta-btn sub" type="button" id="tapick">ほかの種目</button>'+
    '<button class="ta-btn sub" type="button" id="taback">メニューへ</button>'+
    '</div></div>';
  metaBox.innerHTML='<div class="meta-cell"><div class="meta-label">点</div><div class="meta-val">'+ta.score+'</div></div>'+
    '<div class="meta-cell"><div class="meta-label">ベスト</div><div class="meta-val">'+
    ((BEST[ev.key]&&BEST[ev.key].score)||0)+'</div></div>'+
    '<div class="meta-cell"><div class="meta-label">今日の○</div><div class="meta-val">'+DAY.marks+'</div></div>';
  foot.textContent="";

}

function quotaCard(){
  ensureDay();
  var T=totalStats();
  var left=T.need-T.marks;                 /* 8/31までに集めるべき○の残り */
  var d=daysLeft();
  if(left<=0){
    return '<div class="quota clear"><div class="h"><span class="t">全部そろった</span>'+
      '<span class="d">8/31まで あと'+d+'日</span></div>'+
      '<div class="note">'+T.total+'項目すべてに○が2つついた。あとは間違い直しと、気になる種目をくり返すだけ。</div></div>';
  }
  var perDay=Math.ceil(left/d);
  var got=DAY.marks;
  var rest=Math.max(0,perDay-got);
  var pct=Math.min(100,Math.round(got/perDay*100));
  var sets=Math.max(1,Math.ceil(rest/9));
  var body;
  if(rest===0){
    body='<div class="big"><span class="n">'+got+'</span><span class="s">/ '+perDay+'</span>'+
      '<span class="l">今日の○</span></div>'+
      '<div class="qbar"><i style="width:100%"></i></div>'+
      '<div class="note">今日のぶんは終わり。ここでやめてよい。結果をLINEで送っておく。</div>';
  } else {
    body='<div class="big"><span class="n">'+got+'</span><span class="s">/ '+perDay+'</span>'+
      '<span class="l">今日の○</span></div>'+
      '<div class="qbar"><i style="width:'+pct+'%"></i></div>'+
      '<div class="note">あと <b style="color:var(--red)">○'+rest+'</b>　＝　'+sets+'セットくらい。<br>'+
      '残り'+d+'日で○'+left+'個。今日のぶんが終わったらやめてよい。</div>';
  }
  return '<div class="quota'+(rest===0?" clear":"")+'"><div class="h">'+
    '<span class="t">今日のぶん</span><span class="d">8/31まで あと'+d+'日</span></div>'+body+'</div>';
}

function dayText(){
  if(DAY.date!==dayKey()||!DAY.runs.length) return "";
  var h=0,n=0,ms=[];
  DAY.runs.forEach(function(r){ h+=r.hits; n+=r.n; r.missed.forEach(function(x){ if(ms.indexOf(x)<0) ms.push(x); }); });
  var T=totalStats();
  var t="古文ドリル "+todayStr()+"\n今日 "+DAY.runs.length+"回　"+h+"/"+n+"\n";
  DAY.runs.forEach(function(r){ t+="・"+r.name+" "+r.hits+"/"+r.n+"\n"; });
  if(ms.length) t+="間違い: "+ms.join("、")+"\n";
  t+="○ "+T.marks+"/"+T.need+"　済んだ語 "+T.done;
  return t;
}
function dayCard(){
  if(DAY.date!==dayKey()||!DAY.runs.length) return "";
  var h=0,n=0;
  DAY.runs.forEach(function(r){ h+=r.hits; n+=r.n; });
  return '<div class="daycard"><div class="h">今日やったぶん</div>'+
    '<div class="b">'+DAY.runs.length+'回　'+h+' / '+n+' 問正解</div>'+

function refPage(){
  app.innerHTML='<div class="evname"><span class="nm">コツ一覧</span>'+
    '<button class="b-quit" type="button" id="back">とじる</button></div>'+REF+
    '<div class="btn-row one"><button class="btn-sub" type="button" id="back2">種目を選ぶ</button></div>';
  foot.textContent="";
  window.scrollTo(0,0);
  document.getElementById("back").addEventListener("click",menu);
  document.getElementById("back2").addEventListener("click",menu);
}

function begin(e,onlyBad){
  ev=e; isFix=onlyBad; isAll=false;
  var ids=selectIds(e,onlyBad);
  if(!ids.length){ menu(); return; }
  quiz=ids.map(function(id){ var i=e.ids.indexOf(id); var q=e.make(e.pool[i]); q.id=id; q.state=st(id); return q; });
  runInit();
}
function beginAllBad(){
  var all=[];
  EVENTS.forEach(function(e){ e.ids.forEach(function(id,i){ if(st(id)===0) all.push({e:e,i:i,id:id}); }); });
  all=shuffle(all).slice(0,N);
  if(!all.length){ menu(); return; }
  ev={no:"—",name:"全種目の間違い直し",
    howto:"一度間違えた項目だけを集めている。2回続けて正解すると「済」になる。"};
  isFix=true; isAll=true;
  quiz=all.map(function(x){ var q=x.e.make(x.e.pool[x.i]); q.id=x.id; q.state=0; return q; });
  runInit();
}
function runInit(){ idx=0; hits=0; log=[]; t0=Date.now();
  clearInterval(tick); tick=setInterval(clock,1000); stampToday(); window.scrollTo(0,0); render(); }
function clock(){ var s=Math.floor((Date.now()-t0)/1000);
  var el=document.getElementById("m-time"); if(el) el.textContent=Math.floor(s/60)+":"+pad(s%60); }
function elapsed(){ var s=Math.floor((Date.now()-t0)/1000); return Math.floor(s/60)+":"+pad(s%60); }

function chrome(){ metaBox.innerHTML=
  '<div class="meta-cell"><div class="meta-label">問</div><div class="meta-val" id="m-prog">'+(idx+1)+' / '+quiz.length+'</div></div>'+
  '<div class="meta-cell"><div class="meta-label">正</div><div class="meta-val" id="m-hit">'+hits+'</div></div>'+
  '<div class="meta-cell"><div class="meta-label">経過</div><div class="meta-val" id="m-time">'+elapsed()+'</div></div>'; }
function lanes(cur){
  var h='<div class="lanes">';
  for(var i=0;i<quiz.length;i++){
    var c="lane",t="";
    if(log[i]){ c+=log[i].ok?" hit":" miss"; t=log[i].ok?"○":"／"; }
    else if(i===cur) c+=" now";
    h+='<div class="'+c+'">'+t+'</div>'; }
  return h+'</div>'; }

function quitQuiz(){ clearInterval(tick); window.scrollTo(0,0); menu(); }

function render(){
  var q=quiz[idx];
  var tag = q.state===0 ? '<div class="tagnew re">まちがい直し</div>'
          : (q.state<0 ? '<div class="tagnew">はじめて</div>' : '');
  var qbody;
  if(q.flip){
    qbody='<div class="ask">'+q.ask+'</div>'+
      '<div class="flipq">'+q.qtext+'</div>'+
      (q.sub2?'<div class="flipq2">'+q.sub2+'</div>':'')+
      '<div class="flipn">'+q.count+'</div>'+
      '<div class="subline">声に出して言ってから開く</div>'+
      '<button class="next" type="button" id="flip">答えを見る</button>';
  } else {
    qbody='<div class="ask">'+q.ask+'</div>'+
      (q.sent?'<div class="sent">'+q.sent+'</div>':'')+
      (q.word?'<div class="word'+(q.kana?" kana":"")+'">'+q.word+'</div>':'')+
      (q.cue?'<div class="cue"><b>'+q.cue+'</b></div>':'')+
      (q.sub?'<div class="subline">'+q.sub+'</div>':'')+
      '<div class="choices" id="choices"></div>';
  }
  app.innerHTML=
    '<div class="evname"><span class="no">'+(isAll?"直し":ev.no)+'</span>'+
    '<span class="nm">'+ev.name+(isFix&&!isAll?"（直し）":"")+'</span>'+
    '<button class="b-quit" type="button" id="quit">やめる</button></div>'+
    '<details class="howto"><summary>この種目の手順</summary><div class="howto-body">'+ev.howto+'</div></details>'+
    '<details class="howto ref"><summary>コツ一覧を見る</summary>'+REF+'</details>'+
    lanes(idx)+
    '<div class="card">'+tag+qbody+'</div><div id="verdict"></div>'+
    '<div class="btn-row one"><button class="btn-sub" type="button" id="quit2">種目を選ぶ</button></div>';
  chrome();
  document.getElementById("quit").addEventListener("click",quitQuiz);
  document.getElementById("quit2").addEventListener("click",quitQuiz);
  if(q.flip){
    document.getElementById("flip").addEventListener("click",function(){
      this.disabled=true; this.style.display="none";
      document.getElementById("verdict").innerHTML=
        '<div class="flipa">'+q.atext+'</div>'+
        '<div class="selfgrade">'+
        '<button class="sg ok" type="button" id="sgok">言えた</button>'+
        '<button class="sg ng" type="button" id="sgng">言えなかった</button></div>';
      document.getElementById("sgok").addEventListener("click",function(){ commit(true,"言えた"); });
      document.getElementById("sgng").addEventListener("click",function(){ commit(false,"言えなかった"); });
    });
    foot.textContent="残り "+(quiz.length-idx)+" 問";
    return;
  }
  var box=document.getElementById("choices");
  q.opts.forEach(function(o){
    var b=document.createElement("button");
    b.type="button"; b.className="choice"+(q.kanaOpts?" kana":"");
    b.textContent=o; b.setAttribute("data-o",o);
    b.addEventListener("click",function(){ answer(o); });
    box.appendChild(b); });
  foot.textContent="残り "+(quiz.length-idx)+" 問";
}

function answer(picked){ commit(picked===quiz[idx].ans, picked); }

function commit(ok,pickLabel){
  var q=quiz[idx];
  if(ok) hits++;
  mark(q.id,ok);
  log[idx]={t:q.log,ok:ok,pick:pickLabel,ans:q.ans};
  var bs=app.querySelectorAll(".choice");
  for(var i=0;i<bs.length;i++){
    var o=bs[i].getAttribute("data-o"); bs[i].disabled=true;
    if(o===q.ans) bs[i].className+=" ans"; else if(o===pickLabel) bs[i].className+=" bad"; }
  var sg=app.querySelectorAll(".sg");
  for(var j=0;j<sg.length;j++) sg[j].disabled=true;
  document.getElementById("m-hit").textContent=hits;
  app.querySelector(".lanes").outerHTML=lanes(-1);
  var now=st(q.id);
  var grade = ok ? (now===2 ? '　<b>○○ そろった。この語は「済」。</b>' : '　○が1つ。あと1つで「済」。')
                 : '　○は0にもどった。';
  var stmt = q.flip ? (ok?'言えた。':'覚えなおす。') : q.stmt;
  var head = ok ? '<b>'+sayOK()+'</b>　'+stmt+grade
                : '<b>'+sayNG()+'</b>　'+stmt+(q.flip?'':'　覚えておこう。')+grade;
  var pre = q.flip ? '<div class="flipa">'+q.atext+'</div>' : '';
  document.getElementById("verdict").innerHTML= pre+
    '<div class="verdict"><div class="vmark '+(ok?"ok":"ng")+'">'+
    '<span class="mk">'+(ok?"○":"／")+'</span><span class="lbl">'+head+'</span></div>'+
    '<div class="why">'+q.why+'</div>'+
    '<div class="tip"><div class="h">覚えどころ</div><div class="b">'+q.tip+'</div></div>'+
    '<button class="next" type="button" id="next">'+(idx===quiz.length-1?"記録を見る":"次へ")+'</button></div>';
  var nx=document.getElementById("next");
  nx.addEventListener("click",function(){ if(idx===quiz.length-1) finish(); else { idx++; render(); window.scrollTo(0,0);} });
  nx.focus();
}

function finish(){
  clearInterval(tick);
  var time=elapsed(), n=quiz.length, rows="";
  for(var i=0;i<n;i++){ var r=log[i];
    rows+='<div class="row"><span class="idx">'+pad(i+1)+'</span>'+
      '<span class="mk '+(r.ok?"ok":"ng")+'">'+(r.ok?"○":"／")+'</span>'+
      '<span class="w">'+r.t+'</span>'+
      '<span class="a">'+(r.ok?r.ans:'<b>'+r.ans+'</b>（'+r.pick+'）')+'</span></div>'; }
  var missed=log.filter(function(r){return !r.ok;}).map(function(r){return r.t;});
  pushRun({name:ev.name,hits:hits,n:n,missed:missed});
  var T=totalStats();
  var runText="古文ドリル "+todayStr()+"\n"+ev.name+"　"+hits+"/"+n+"（"+time+"）\n"+
    (missed.length?"間違い: "+missed.join("、"):"全問正解")+
    "\n今日の○ "+DAY.marks+"　累計 ○"+T.marks+"/"+T.need+"（済んだ語 "+T.done+"）";
  var banner = missed.length
    ? '<div class="banner"><div class="h">この'+missed.length+'項目は「間違い」に入った</div>'+
      '<div class="b">'+missed.join("　")+'</div></div>'
    : '<div class="banner good"><div class="h">全問正解</div><div class="b">この回の項目はすべて進んだ</div></div>';
  var Q=(function(){ var lf=T.need-T.marks, dd=daysLeft();
    if(lf<=0) return "全部そろった。";
    var pd=Math.ceil(lf/dd), rs=Math.max(0,pd-DAY.marks);
    return rs===0 ? "今日のぶんは終わり（○"+DAY.marks+"／"+pd+"）。ここでやめてよい。"
                  : "今日のぶん ○"+DAY.marks+" / "+pd+"　あと○"+rs+"。"; })();
  app.innerHTML=
    '<div class="evname"><span class="no">'+(isAll?"直し":ev.no)+'</span>'+
    '<span class="nm">'+ev.name+'</span></div>'+
    '<div class="score"><span class="n">'+hits+'</span><span class="d">/ '+n+'</span>'+
    '<span class="t">'+time+'</span></div>'+banner+
    '<div class="sendnote" style="margin-top:10px">'+Q+'</div>'+
    '<button class="b-line" type="button" id="line">LINEで送る</button>'+
    '<div class="sendnote">今日はここで終わりにするなら送っておく。<br>まだ続けるなら、あとでまとめて送ってもよい。</div>'+
    '<div class="rows">'+rows+'</div>'+
    '<div class="btn-row three">'+
      '<button class="btn-sub" type="button" id="again">もう1回</button>'+
      '<button class="btn-sub" type="button" id="fix"'+(missed.length?'':' disabled')+'>間違いを直す</button>'+
      '<button class="btn-sub" type="button" id="back">種目を選ぶ</button></div>'+
    '<div class="btn-row one"><button class="btn-sub" type="button" id="copy">結果をコピー</button></div>'+
    '<div class="toast" id="toast"></div>';
  metaSummary();
  foot.textContent="集めた○ "+T.marks+" / "+T.need+"　済んだ語 "+T.done+"　間違い "+T.bad;
  document.getElementById("line").addEventListener("click",function(){ sendLine(runText); });
  document.getElementById("back").addEventListener("click",menu);
  document.getElementById("again").addEventListener("click",function(){
    if(isAll) beginAllBad(); else begin(ev,isFix); });
  document.getElementById("fix").addEventListener("click",function(){
    if(isAll) beginAllBad(); else begin(ev,true); });
  document.getElementById("copy").addEventListener("click",function(){
    var t=document.getElementById("toast");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(runText).then(function(){t.textContent="コピーした。";},
        function(){t.textContent=runText;});
    } else { t.textContent=runText; }
  });
}

menu();
})();
</script>
</body>
</html>
