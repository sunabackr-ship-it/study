<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>興味の先 — しごとの地図</title>
<style>
:root{
  --paper:#f5f1e6; --ink:#2b2926; --ink-soft:#6b6459; --line:#d8d0bd;
  --card:#fbf8f0; --gold:#a8862f; --gold-bg:#f3ead2;
  --c-ground:#7a4a2f; --c-life:#2f6b45; --c-body:#9c4433; --c-art:#5a4a7a; --c-field:#3b4a7a;
  --contour:rgba(122,74,47,.07);
}
[data-theme="night"]{
  --paper:#12161f; --ink:#e8e2d4; --ink-soft:#9a927f; --line:#2c3242;
  --card:#1a202c; --gold:#f0dfae; --gold-bg:#2a2618;
  --c-ground:#c08a63; --c-life:#6fae87; --c-body:#d07a66; --c-art:#9d8cc4; --c-field:#7d92c9;
  --contour:rgba(192,138,99,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  background:var(--paper); color:var(--ink); line-height:1.7;
  transition:background .3s,color .3s;
}
.contours{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.contours svg{width:100%;height:100%}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:20px 16px 80px}

header{padding:28px 4px 8px}
.eyebrow{font-size:11px;letter-spacing:.35em;color:var(--ink-soft)}
h1{font-size:30px;font-weight:600;letter-spacing:.08em;margin:6px 0 2px}
.lede{font-size:13px;color:var(--ink-soft);letter-spacing:.05em}
.theme-btn{
  position:absolute;top:24px;right:16px;background:none;border:1px solid var(--line);
  color:var(--ink-soft);border-radius:20px;padding:4px 12px;font-size:12px;
  font-family:inherit;cursor:pointer;
}
.howto{
  margin:18px 0 6px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);font-size:12.5px;color:var(--ink-soft);letter-spacing:.03em;
}
.howto b{color:var(--ink);font-weight:600}
.intro{margin:14px 0 4px;cursor:pointer}
.intro svg{width:100%;height:auto;display:block}
.intro .branch{fill:none;stroke-width:1.6;opacity:.55;stroke-dasharray:100;stroke-dashoffset:100}
.intro .nd{transform-box:fill-box;transform-origin:center;transform:scale(0)}
.intro.play .branch{animation:drawB .55s ease forwards;animation-delay:var(--d,0s)}
.intro.play .nd{animation:popN .5s cubic-bezier(.34,1.8,.64,1) forwards;animation-delay:var(--d,0s)}
@keyframes drawB{to{stroke-dashoffset:0}}
@keyframes popN{to{transform:scale(1)}}
.intro-hint{font-size:10.5px;letter-spacing:.2em;color:var(--ink-soft);text-align:right;margin-top:2px;opacity:.7}
@media (prefers-reduced-motion:reduce){
  .intro .branch{stroke-dashoffset:0;animation:none!important}
  .intro .nd{transform:scale(1);animation:none!important}
}

.core{
  margin:16px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);
  overflow:hidden;border-left:4px solid var(--core-c,var(--ink-soft));
}
.core-head{display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer;user-select:none}
.mark{
  width:46px;height:46px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:600;color:var(--paper);background:var(--core-c);
}
.core-head .t{flex:1}
.core-head .n{font-size:19px;font-weight:600;letter-spacing:.1em}
.core-head .s{font-size:12px;color:var(--ink-soft)}
.chev{color:var(--ink-soft);font-size:13px;transition:transform .25s}
.core.open .chev{transform:rotate(90deg)}
.core-body{display:none;padding:0 16px 14px}
.core.open .core-body{display:block}

.q{margin:6px 0 4px;padding-left:8px}
.q-head{
  font-size:14.5px;font-weight:600;letter-spacing:.04em;cursor:pointer;user-select:none;
  padding:8px 4px;color:var(--core-c);display:flex;gap:8px;align-items:baseline;
}
.q-head::before{content:"—";color:var(--line)}
.q-body{display:none;margin-left:10px;padding-left:14px;border-left:1.5px solid var(--line)}
.q.open>.q-body{display:block}
.field{margin:4px 0 12px}
.f-name{font-size:12px;letter-spacing:.25em;color:var(--ink-soft);margin:8px 0 6px}
.jobs{display:flex;flex-wrap:wrap;gap:8px}
.job{
  border:1px solid var(--line);border-radius:18px;background:var(--paper);
  padding:5px 13px;font-size:13.5px;cursor:pointer;user-select:none;
  font-family:inherit;color:var(--ink);letter-spacing:.02em;
}
.job.opened{border-color:var(--core-c)}

.detail{
  display:none;width:100%;margin:2px 0 6px;padding:12px 13px;
  background:var(--paper);border:1px dashed var(--line);border-radius:8px;font-size:13px;
}
.detail.show{display:block}
.detail .jimg{width:100%;border-radius:6px;margin-bottom:9px;border:1px solid var(--line);display:block}
.detail .d{margin-bottom:8px;font-weight:600;color:var(--core-c);font-size:13.8px;line-height:1.6}
.detail b{font-weight:700}
.detail mark{background:var(--gold-bg);color:inherit;padding:0 2px;border-radius:2px}
.drow{margin:7px 0}
.dlabel{
  font-size:10.5px;letter-spacing:.28em;color:var(--core-c);
  display:block;margin-bottom:1px;font-weight:600;
}
.drow p{font-size:12.8px;line-height:1.75}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.badge{
  font-size:10.5px;padding:1px 8px;border-radius:10px;color:var(--paper);
  letter-spacing:.1em;font-weight:600;
}
.detail .route{margin-top:7px;font-size:12px;color:var(--ink-soft)}
.detail .route::before{content:"⇢ ";color:var(--gold)}

.deadline{
  margin:6px 0 16px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);border-left:4px solid var(--gold);
  font-size:12.5px;color:var(--ink-soft);letter-spacing:.03em;line-height:1.8;
}
.dl-t{font-size:10.5px;letter-spacing:.28em;color:var(--gold);font-weight:600;margin-bottom:4px}
.deadline p{margin:4px 0}
.deadline .dm{
  display:inline-flex;align-items:center;justify-content:center;
  width:19px;height:19px;border-radius:50%;font-size:11.5px;font-weight:600;
  color:var(--paper);background:var(--dc);margin:0 1px;vertical-align:-3px;
}
footer{
  margin-top:36px;padding-top:14px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--ink-soft);
}
.share-btn{
  background:none;border:1px solid var(--line);border-radius:16px;color:var(--ink-soft);
  padding:3px 12px;font-size:11.5px;font-family:inherit;cursor:pointer;
}
</style>
</head>
<body>
<div class="contours" aria-hidden="true">
<svg viewBox="0 0 640 900" preserveAspectRatio="xMidYMid slice">

<path d="M-50 120 Q160 40 340 130 T750 100"/>
<path d="M-50 180 Q180 90 360 190 T750 160"/>
<path d="M-50 250 Q200 150 380 260 T750 230"/>

</g>
</svg>
</div>

<div class="wrap">
<button class="theme-btn" id="themeBtn">夜</button>
<header>
  <div class="eyebrow">CAREER MAP</div>
  <h1>興味の先</h1>
  <div class="lede">いまの興味が、どの仕事までつながっているか</div>
</header>

<div class="howto">
入り口は<b>五つ</b>。気になるものをタップすると、問いが開き、その先に仕事が並ぶ。正解を選ぶ地図ではなく、眺める地図。
</div>

</div>

<div class="deadline">
  <div class="dl-t">しめきり</div>
  <p>この地図の入り口の多くは、高2の理科・文理の選択で決まる。希望調査の紙は、たいてい高1の秋に来る。</p>
  <p><span class="dm" style="--dc:var(--c-ground)">地</span>は物理か化学、<span class="dm" style="--dc:var(--c-life)">生</span>は生物と化学、<span class="dm" style="--dc:var(--c-body)">体</span>は物理か生物、<span class="dm" style="--dc:var(--c-art)">絵</span>は美術に理科をひとつ、<span class="dm" style="--dc:var(--c-field)">外</span>はどこからでも。地学は授業のない高校が多く、そこは独学と博物館で足す世界。</p>
</div>

<div id="map"></div>

<footer>
  <span id="stat"></span>
  <button class="share-btn" id="shareBtn">記録をコピー</button>
</footer>
</div>

<script>
const CORE_COLORS={地:'var(--c-ground)',生:'var(--c-life)',体:'var(--c-body)',絵:'var(--c-art)',外:'var(--c-field)'};
const CORE_NAMES={地:'地面',生:'生き物',体:'身体',絵:'絵',外:'外'};

const DATA=[
{id:'ground',mark:'地',name:'地面',sub:'地層・地形・地球の中身',q:[
 {id:'g1',q:'地面の下は、どうなってる？',f:[
  {n:'地質のしごと',j:[
   {id:'chishitsu',n:'地質調査技士',d:'地面の下を読んで、ビルと橋の足元を保証する「地盤の門番」。',
    w:'ボーリングマシンで地下数十mまで掘り、土や岩を採って強さを試験する。その報告書が建物の設計の土台になる。',
    y:'自分の判定の上にビルや橋が建つ。地面の下を毎日のぞける、数少ない仕事。',
    ai:'掘ったコアの写真判読やデータ整理はAIが下書きするようになる。<b>現場で掘り、最終判定に責任を持つのは人。</b>解析が速くなる分、一人が回せる現場が増える。',
    hs:'入口は<b>数学</b>と<b>理科</b>（<b>物理</b>か<b>化学</b>）。文理選択は理系。土木・地質系の学科は地方国立に多く、志望者は少なめ。',u:'理学部の地球科学科か、工学部の土木系。地質系は信州大・山口大・島根大など地方国立に多い。学びの中心は野外<b>巡検</b>——実際に地層を歩いて測る実習で、そこで覚えた露頭（崖に現れた地層）の読み方がそのまま現場の武器になる。',
    c:['地']},
   {id:'dojo-osen',n:'土壌汚染調査',d:'土の汚れを人より先に見つける「土地の健康診断医」。',
    w:'土や地下水を採取して有害物質を分析する。工場跡地の再開発や土地取引の前に入る調査で、法律で義務になる場面も多い。',
    y:'汚染を先に見つけて、そこに住む人の健康被害を未然に防ぐ。',
    ai:'分析データの整理と報告書の下書きはAI化が進む。<b>どこを掘るかの計画と現場の判断は人。</b>',
    hs:'使うのは<b>化学</b>。環境系・応用<b>化学</b>系の学部が入口。',u:'工学部の環境系・応用化学系。地方国立の環境工学科が入口として現実的。分析化学の実験を繰り返して、水と土を測る手順を身体で覚える。その実験手技が調査会社の実務そのもの。',
    c:['地']},
   {id:'dojo-gaku',n:'土壌学者・肥料設計',d:'畑の実りを土から設計する「土の処方箋屋」。',

    y:'同じ畑の収穫量が、自分の設計ひとつで変わる。',
    ai:'成分データの解析はAIが得意。<b>畑ごとの条件を読んで処方を決めるのは人。</b>',
    hs:'<b>化学</b>と<b>生物</b>の両方。入口は農学部。',u:'農学部（北海道大・東京農工大や地方国立農学部）。土壌学・植物栄養学の講義と<b>農場実習</b>の往復で、畑で測って結果を確かめる繰り返しが肥料設計の目を作る。',
    c:['地','生']},
   {id:'chinetsu',n:'地熱開発技術者',d:'火山の国の熱を掘り当てる「地球のボイラー技師」。',

    y:'火山国・日本の地の利をそのままエネルギーに変える、伸びしろの大きい分野。',
    ai:'地下構造の推定はAI解析が主力になっていく。<b>どこを掘るかの最終判断と現場は人。</b>',
    hs:'<b>物理</b>と<b>数学</b>。資源工学・地球科学系の学科へ。',u:'資源系の学科（秋田大の国際資源学部、九州大の地球資源システムなど）。全国に数えるほどしかない学科なので、今は<mark>就職が強い</mark>。地質学と掘削工学を学び、フィールド実習で「見えない地下を推定する」訓練をする。',
    c:['地']},
   {id:'chishitsu-gaku',n:'地質学者・古生物学者',d:'崖の縞模様から46億年を読み解く「地球の歴史家」。',
    w:'野外で地層を記録し、化石や岩石を分析して、その土地に何が起きたかを復元する。大学・博物館・研究所が職場。',
    y:'誰も知らなかった46億年の1ページを、自分が最初に読む。',
    ai:'文献調査や化石画像の分類はAIが強力な助手になる。<b>野外で地層を見て仮説を立てるのは人。</b>',
    hs:'理系選択＋大学院まで行く前提。<b>地学</b>の授業がない高校が多いので、<b>地学</b>基礎の独学と博物館通いがそのまま差になる。',u:'理学部地球科学科（東北大・筑波大・広島大など）から大学院へ。学部では<b>巡検</b>（地層を歩いて調べる野外実習）と岩石の顕微鏡観察、<b>卒業研究</b>で自分のフィールドを持つ。研究者の仕事は、この卒研テーマの延長線上にある。',

   {id:'wakusei',n:'惑星地質学者',d:'火星の地層を読む「地球の外の地質屋」。',

    ai:'膨大な探査画像の一次選別はもうAIの仕事。<b>それが何を意味するか解釈するのは人。</b>',
    hs:'地質学者と同じ道＋<b>英語</b>。研究の世界は資料も論文もほぼ<b>英語</b>。',
    u:'地球科学科から大学院で惑星科学へ（東大・北大・神戸大などに惑星系の<b>研究室</b>）。地球の地層で鍛えた読みを、探査機のデータに応用する——学びの接続がいちばん素直な宇宙への道。',
    c:['地'],route:'地質学 → 大学院 → 宇宙研究（JAXA・大学）'}
  ]}
 ]},
 {id:'g2',q:'なぜ崩れる？　どう守る？',f:[
  {n:'防災のしごと',j:[

const KEY='career-map-v1';
let store={opened:{},last:null};
try{const s=localStorage.getItem(KEY);if(s)store=JSON.parse(s)}catch(e){}
function save(){store.last=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function markOpen(id){if(!store.opened[id]){store.opened[id]=new Date().toISOString().slice(0,10);save();updateStat();}}

const map=document.getElementById('map');
let jobTotal=0;
DATA.forEach(core=>{
  const el=document.createElement('div');
  el.className='core';el.style.setProperty('--core-c',CORE_COLORS[core.mark]);
  el.innerHTML=`<div class="core-head">
    <div class="mark">${core.mark}</div>
    <div class="t"><div class="n">${core.name}</div><div class="s">${core.sub}</div></div>
    <div class="chev">▶</div></div><div class="core-body"></div>`;
  const body=el.querySelector('.core-body');
  el.querySelector('.core-head').addEventListener('click',()=>{
    el.classList.toggle('open');
    if(el.classList.contains('open'))markOpen('core:'+core.id);
  });
  core.q.forEach(q=>{
    const qEl=document.createElement('div');qEl.className='q';
    qEl.innerHTML=`<div class="q-head">${q.q}</div><div class="q-body"></div>`;
    const qBody=qEl.querySelector('.q-body');
    qEl.querySelector('.q-head').addEventListener('click',()=>{
      qEl.classList.toggle('open');
      if(qEl.classList.contains('open'))markOpen('q:'+q.id);
    });
    q.f.forEach(field=>{
      const fEl=document.createElement('div');fEl.className='field';
      fEl.innerHTML=`<div class="f-name">${field.n}</div><div class="jobs"></div>`;
      const jWrap=fEl.querySelector('.jobs');
      field.j.forEach(job=>{
        jobTotal++;
        const b=document.createElement('button');
        b.className='job'+(store.opened['job:'+job.id]?' opened':'');
        b.textContent=job.n;
        const det=document.createElement('div');det.className='detail';
        const badges=job.c.map(c=>`<span class="badge" style="background:${CORE_COLORS[c]}">${CORE_NAMES[c]}</span>`).join('');
        const row=(label,text)=>text?`<div class="drow"><span class="dlabel">${label}</span><p>${text}</p></div>`:'';
        det.innerHTML=`<img class="jimg" src="img/${job.id}.png" loading="lazy" alt="" onerror="this.remove()">`+
          `<div class="d">${job.d}</div>`+
          row('しごと',job.w)+
          row('やりがい',job.y)+
          row('AIでどう変わる',job.ai)+
          row('高校でやること',job.hs)+
          row('大学と学び',job.u)+
          `<div class="badges">${badges}</div>`+
          (job.route?`<div class="route">${job.route}</div>`:'');
        b.addEventListener('click',()=>{
          det.classList.toggle('show');
          b.classList.add('opened');
          markOpen('job:'+job.id);
        });
        jWrap.appendChild(b);jWrap.appendChild(det);
      });
      qBody.appendChild(fEl);
    });
    body.appendChild(qEl);
  });
  map.appendChild(el);
});

function openedJobs(){return Object.keys(store.opened).filter(k=>k.startsWith('job:')).length}
function updateStat(){document.getElementById('stat').textContent=`ひらいた仕事：${openedJobs()} / ${jobTotal}`}
updateStat();

document.getElementById('shareBtn').addEventListener('click',()=>{
  const names=[];
  DATA.forEach(c=>c.q.forEach(q=>q.f.forEach(f=>f.j.forEach(j=>{
    if(store.opened['job:'+j.id])names.push(j.n);
  }))));
  const text=`しごとの地図 ${openedJobs()}/${jobTotal}\n`+names.join('、');
  navigator.clipboard?.writeText(text).then(()=>{
    const b=document.getElementById('shareBtn');b.textContent='コピーした';
    setTimeout(()=>b.textContent='記録をコピー',1500);
  });
});

const intro=document.getElementById('intro');
requestAnimationFrame(()=>intro.classList.add('play'));
intro.addEventListener('click',()=>{
  intro.classList.remove('play');
  void intro.offsetWidth;
  intro.classList.add('play');
});

const TKEY='study-portal-theme';
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  document.getElementById('themeBtn').textContent=t==='night'?'昼':'夜';
}
let theme='day';
try{theme=localStorage.getItem(TKEY)==='night'?'night':'day'}catch(e){}
applyTheme(theme);
document.getElementById('themeBtn').addEventListener('click',()=>{
  theme=theme==='night'?'day':'night';
  applyTheme(theme);
  try{localStorage.setItem(TKEY,theme)}catch(e){}
});
</script>
